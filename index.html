<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Docker - GitHub Actions Tutorial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;

            height: 100vh;
            margin: 0;
        }
        .card {

        }

<body>
    <div class="card">
        <h1>Hello Docker</h1>

</html>
